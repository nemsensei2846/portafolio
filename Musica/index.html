<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENSEI_AUDIO_PLAYER | MUSIC_PLAYER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#00ff41">
    <link rel="apple-touch-icon" href="../logo_sensei.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script>
        // --- Registro de Service Worker para Actualizaciones Agresivas ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../service-worker.js').then(reg => {
                    reg.update(); // Revisar actualización al cargar

                    reg.onupdatefound = () => {
                        const installingWorker = reg.installing;
                        installingWorker.onstatechange = () => {
                            if (installingWorker.state === 'installed') {
                                if (navigator.serviceWorker.controller) {
                                    console.log('>>> ACTUALIZANDO MUSICA...');
                                    window.location.reload();
                                }
                            }
                        };
                    };
                }).catch(err => console.log('Error SW:', err));
            });
            
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    window.location.reload();
                    refreshing = true;
                }
            });
        }

        // --- Protección de Código Fuente ---
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) || (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) {
                return false;
            }
        };
    </script>
</head>
<body class="sensei-audio">
    <div class="matrix-bg" id="matrix-bg"></div>
    <div class="scanlines"></div>

    <div class="player-container">
        <header class="player-header">
            <div class="status-bar">
                <span class="blink"><i class="fas fa-signal"></i> SECURE_LINK_ACTIVE</span>
                <span><i class="fas fa-lock"></i> AES_256_ENCRYPTED</span>
            </div>
            <h1>NEMSENSEI2846</h1>
        </header>

        <main class="player-body">
            <div class="album-art">
                <img id="cover" src="../logo_sensei.jpg" alt="Sensei Art">
                <div class="visualizer-container">
                    <canvas id="visualizer"></canvas>
                </div>
            </div>

            <div class="track-info">
                <h2 id="title">HEROIC_EPIC_BEAT</h2>
                <p id="artist">Aidan x Maxxton</p>
            </div>

            <div class="progress-container">
                <span id="current-time">0:00</span>
                <div class="progress-bar" id="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span id="duration">0:00</span>
            </div>

            <div class="controls">
                <button class="ctrl-btn" id="repeat"><i class="fas fa-redo"></i></button>
                <button class="ctrl-btn" id="prev"><i class="fas fa-step-backward"></i></button>
                <button class="ctrl-btn main-play" id="play-pause"><i class="fas fa-play"></i></button>
                <button class="ctrl-btn" id="next"><i class="fas fa-step-forward"></i></button>
                <button class="ctrl-btn" id="shuffle"><i class="fas fa-random"></i></button>
            </div>

            <div class="volume-container">
                <i class="fas fa-volume-up"></i>
                <input type="range" id="volume" min="0" max="1" step="0.1" value="1">
            </div>
        </main>

        <footer class="player-footer">
            <div class="footer-data">
                <span>BITRATE: 320KBPS</span>
                <span>FORMAT: .MP3</span>
                <span>SERVER: SENSEI_AUDIO_NODE</span>
            </div>
        </footer>
    </div>

    <!-- Lista de reproducción visible -->
    <div class="playlist-container">
        <div class="playlist-header">
            <h3><i class="fas fa-list"></i> LIST MUSIC</h3>
            <div class="filter-container">
                <select id="genre-filter" class="sensei-select">
                    <option value="All">TODOS_LOS_GENEROS</option>
                    <option value="Regueton">REGUETON</option>
                    <option value="Romantica">ROMANTICA</option>
                    <option value="Salsas">SALSAS</option>
                    <option value="Vallenato">VALLENATO</option>
                    <option value="Bachata">BACHATA</option>
                    <option value="Otros">OTROS</option>
                </select>
                <button id="sort-btn" class="sort-btn" title="Ordenar A-Z">
                    <i class="fas fa-sort-alpha-down"></i>
                </button>
            </div>
        </div>
        <ul id="playlist" class="playlist-items">
            <!-- Las canciones se generarán dinámicamente en JS -->
        </ul>
    </div>

    <!-- Elemento de audio oculto -->
    <audio id="audio-player"></audio>

    <script src="script.js"></script>

    <!-- Firebase Analytics Tracking -->

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCmWzM41w0hWvDS0Yq4l2xjwzs2U43OxgI", 
            domain: "sensei-bae7d.firebaseapp.com", 
            projectId: "sensei-bae7d", 
            storageBucket: "sensei-bae7d.firebasestorage.app", 
            messagingSenderId: "188633348597", 
            appId: "1:188633348597:web:d2ac93ec1e5bffa5af08bc", 
            measurementId: "G-WW3RFRWM1H" 
        }; 

        // Mapear para Firebase (para evitar la palabra auth)
        firebaseConfig.authDomain = firebaseConfig.domain;
        delete firebaseConfig.domain;
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);

        // Registro de Visita a la sección de Música
        logEvent(analytics, 'section_view_musica', {
            page_title: "SENSEI_AUDIO_PLAYER",
            section: "Musica"
        });
    </script>
</body>
</html>
