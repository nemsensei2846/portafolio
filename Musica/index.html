<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FBI_AUDIO_DECRYPTOR | MUSIC_PLAYER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="hacker-audio">
    <div class="matrix-bg" id="matrix-bg"></div>
    <div class="scanlines"></div>

    <div class="player-container">
        <header class="player-header">
            <div class="status-bar">
                <span class="blink"><i class="fas fa-signal"></i> SECURE_LINK_ACTIVE</span>
                <span><i class="fas fa-lock"></i> AES_256_ENCRYPTED</span>
            </div>
            <h1>NEMSENSEI2846</h1>
        </header>

        <main class="player-body">
            <div class="album-art">
                <img id="cover" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJidm96eGZ6Znh6Znh6Znh6Znh6Znh6Znh6Znh6Znh6Znh6Znh6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/3o7TKMGpxxcaatvAyc/giphy.gif" alt="Hacker Art">
                <div class="visualizer-container">
                    <canvas id="visualizer"></canvas>
                </div>
            </div>

            <div class="track-info">
                <h2 id="title">HEROIC_EPIC_BEAT</h2>
                <p id="artist">Aidan x Maxxton</p>
            </div>

            <div class="progress-container">
                <span id="current-time">0:00</span>
                <div class="progress-bar" id="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span id="duration">0:00</span>
            </div>

            <div class="controls">
                <button class="ctrl-btn" id="repeat"><i class="fas fa-redo"></i></button>
                <button class="ctrl-btn" id="prev"><i class="fas fa-step-backward"></i></button>
                <button class="ctrl-btn main-play" id="play-pause"><i class="fas fa-play"></i></button>
                <button class="ctrl-btn" id="next"><i class="fas fa-step-forward"></i></button>
                <button class="ctrl-btn" id="shuffle"><i class="fas fa-random"></i></button>
            </div>

            <div class="volume-container">
                <i class="fas fa-volume-up"></i>
                <input type="range" id="volume" min="0" max="1" step="0.1" value="1">
            </div>
        </main>

        <footer class="player-footer">
            <div class="footer-data">
                <span>BITRATE: 320KBPS</span>
                <span>FORMAT: .MP3</span>
                <span>SERVER: QUANTICO_AUDIO_NODE</span>
            </div>
        </footer>
    </div>

    <!-- Lista de reproducción visible -->
    <div class="playlist-container">
        <div class="playlist-header">
            <h3><i class="fas fa-list"></i> LIST MUSIC</h3>
        </div>
        <ul id="playlist" class="playlist-items">
            <!-- Las canciones se generarán dinámicamente en JS -->
        </ul>
    </div>

    <!-- Elemento de audio oculto -->
    <audio id="audio-player"></audio>

    <script src="script.js"></script>
</body>
</html>
