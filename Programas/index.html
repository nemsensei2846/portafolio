<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FBI_SECURE_ACCESS | LOGIN_REGISTER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="fbi-theme">
    <canvas id="matrix-canvas"></canvas>
    <div class="scanlines"></div>

    <div class="auth-container">
        <div class="fbi-shield">
            <img src="https://upload.wikimedia.org/wikipedia/commons/d/da/Seal_of_the_Federal_Bureau_of_Investigation.svg" alt="FBI Seal">
        </div>
        
        <header class="auth-header">
            <h1>FEDERAL BUREAU OF INVESTIGATION</h1>
            <p class="status-text">>>> ACCESO RESTRINGIDO: NIVEL_5_DETECCION</p>
        </header>

        <!-- Formulario de Login -->
        <div id="login-form" class="auth-box">
            <h2 class="form-title">SISTEMA_DE_LOGIN</h2>
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="login-username" placeholder="USUARIO / EMAIL" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="login-password" placeholder="PASSWORD" required>
            </div>
            <button id="btn-login" class="hacker-btn">INGRESAR_SISTEMA</button>
            <p class="switch-auth">¿NO TIENE CUENTA? <span onclick="toggleAuth('register')">REGISTRAR_NUEVO_AGENTE</span></p>
        </div>

        <!-- Formulario de Registro -->
        <div id="register-form" class="auth-box" style="display: none;">
            <h2 class="form-title">REGISTRO_DE_AGENTE</h2>
            <div class="input-group">
                <i class="fas fa-id-card"></i>
                <input type="text" id="reg-name" placeholder="NOMBRE_COMPLETO" required>
            </div>
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="reg-email" placeholder="CORREO_ELECTRONICO" required>
            </div>
            <div class="input-group">
                <i class="fas fa-user-plus"></i>
                <input type="text" id="reg-username" placeholder="USUARIO" required>
            </div>
            <div class="input-group">
                <i class="fas fa-key"></i>
                <input type="password" id="reg-password" placeholder="PASSWORD" required>
            </div>
            <div class="terms-group">
                <input type="checkbox" id="reg-terms">
                <label for="reg-terms">ACEPTO_TERMINOS_Y_CONDICIONES_FBI</label>
            </div>
            <button id="btn-register" class="hacker-btn">SOLICITAR_REGISTRO</button>
            <p class="switch-auth">¿YA TIENE CUENTA? <span onclick="toggleAuth('login')">VOLVER_AL_LOGIN</span></p>
        </div>

        <!-- Mensajes de Estado -->
        <div id="auth-message" class="terminal-msg"></div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module" src="auth.js"></script>
    <script>
        function toggleAuth(type) {
            const login = document.getElementById('login-form');
            const register = document.getElementById('register-form');
            const msg = document.getElementById('auth-message');
            msg.innerText = '';
            
            if (type === 'register') {
                login.style.display = 'none';
                register.style.display = 'block';
            } else {
                login.style.display = 'block';
                register.style.display = 'none';
            }
        }
        window.toggleAuth = toggleAuth; // Hacerlo disponible para auth.js module

        // Matrix Effect
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const letters = "0101010101010101FBI_ACCESS_GRANTED_DENIED_";
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00ff41";
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
