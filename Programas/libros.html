<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libros | PROGRAMMING_BOOKS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="fbi-theme">
    <canvas id="matrix-canvas"></canvas>
    <div class="scanlines"></div>

    <div class="books-container">
        <header class="auth-header">
            <div class="fbi-shield">
                <img src="images.jfif" alt="FBI Seal">
            </div>
            <h1>BOOK PROGRAMMING DATABASE</h1>
            <p class="status-text">>>> ACCESO CONCEDIDO: NIVEL 1✅</p>
        </header>

        <div class="books-grid">
            <!-- Libro 1: Programación Orientada a Objetos -->
            <div class="book-card">
                <img src="fotos/Programacion Orientada a objectos.png" alt="Portada del libro Programación Orientada a Objetos" class="book-cover" onclick="openModal('poo')">
                <div class="book-info">
                    <h3>Programación Orientada a Objetos</h3>
                    <a href="Libros/Programacion Orientada a objectos.pdf" target="_blank" class="hacker-btn">VISUALIZAR</a>
                </div>
            </div>

            <!-- Libro 2: Asincronismo en JavaScript -->
            <div class="book-card">
                <img src="fotos/asincronismo-en-javascript-683x1024.webp" alt="Portada del libro Asincronismo en JavaScript" class="book-cover" onclick="openModal('async')">
                <div class="book-info">
                    <h3>Asincronismo en JavaScript</h3>
                    <a href="Libros/Asincronismo-en-JavaScript-Charly-Cimino.pdf" target="_blank" class="hacker-btn">VISUALIZAR</a>
                </div>
            </div>

            <!-- Libro 3: CSS3 y Javascript Avanzado -->
            <div class="book-card">
                <img src="fotos/CSS3 y Javascript avanzado.png" alt="Portada del libro CSS3 y Javascript Avanzado" class="book-cover" onclick="openModal('cssjs')">
                <div class="book-info">
                    <h3>CSS3 y Javascript Avanzado</h3>
                    <a href="Libros/CSS3-y-Javascript-Avanzado-1.pdf" target="_blank" class="hacker-btn">VISUALIZAR</a>
                </div>
            </div>

            <!-- Libro 4: Doma de serpientes para niños -->
            <div class="book-card">
                <img src="fotos/Snake Wrangling for Kids, Learning to Program with Python.png" alt="Portada del libro Doma de serpientes para niños" class="book-cover" onclick="openModal('snake')">
                <div class="book-info">
                    <h3>Doma de serpientes para niños</h3>
                    <a href="Libros/doma-de-serpientes-para-ninos_swfk-es-win-0.0.4.pdf" target="_blank" class="hacker-btn">VISUALIZAR</a>
                </div>
            </div>
        </div>

        <button onclick="logout()" class="hacker-btn" style="margin-top: 40px; width: 200px;">CERRAR_SESION</button>
    </div>

    <!-- Modal de Detalles del Libro -->
    <div id="book-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modal-title"></h2>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Firebase RTDB Logic -->
    <script type="module">
        window.logout = () => {
            localStorage.removeItem('fbi_session');
            window.location.href = "index.html";
        };

        // Verificación de sesión local (ya incluida en auth.js, pero por seguridad)
        if (!localStorage.getItem('fbi_session')) {
            window.location.href = "index.html";
        }

        // Datos de los libros
        const bookData = {
            poo: {
                title: "Datos del libro",
                body: `
                    <p><strong>Título:</strong> Programación Orientada a Objetos</p>
                    <p><strong>Autores:</strong> Roberto Rodríguez Echeverría, Álvaro Prieto Ramos, Encarna Sosa Sánchez</p>
                    <p><strong>Categoría principal:</strong> Programación</p>
                    <p><strong>Idioma:</strong> Español</p>
                    <p><strong>Licencia:</strong> Creative Commons Reconocimiento-NoComercial-CompartirIgual 3.0 Unported (CC BY-NC-SA 3.0)</p>
                `
            },
            async: {
                title: "Datos del libro",
                body: `
                    <p><strong>Título:</strong> Asincronismo en JavaScript</p>
                    <p><strong>Autor:</strong> Charly Cimino</p>
                    <p><strong>Categoría principal:</strong> Programación Web</p>
                    <p><strong>Idioma:</strong> Español</p>
                    <p><strong>Licencia:</strong> Desconocida</p>
                `
            },
            cssjs: {
                title: "Datos del libro",
                body: `
                    <p><strong>Título:</strong> CSS3 y Javascript Avanzado</p>
                    <p><strong>Autor:</strong> Jordi Collell Puig</p>
                    <p><strong>Categoría principal:</strong> Desarrollo web</p>
                    <p><strong>Subcategoría:</strong> Frontend</p>
                    <p><strong>Idioma:</strong> Español</p>
                    <p><strong>Licencia:</strong> Creative Commons BY-SA 3.0 España</p>
                `
            },
            snake: {
                title: "Datos del libro",
                body: `
                    <p><strong>Título:</strong> Doma de serpientes para niños</p>
                    <p><strong>Autor:</strong> Jason R. Briggs</p>
                    <p><strong>Categoría principal:</strong> Programación para niños</p>
                    <p><strong>Subcategoría:</strong> Python</p>
                    <p><strong>Idioma:</strong> Español</p>
                    <p><strong>Licencia:</strong> Creative Commons BY-NC-SA 3.0</p>
                `
            }
        };

        window.openModal = (bookId) => {
            const modal = document.getElementById('book-modal');
            const titleEl = document.getElementById('modal-title');
            const bodyEl = document.getElementById('modal-body');
            
            const data = bookData[bookId];
            if (data) {
                titleEl.innerText = data.title;
                bodyEl.innerHTML = data.body;
                modal.style.display = 'flex';
            }
        };

        window.closeModal = () => {
            const modal = document.getElementById('book-modal');
            modal.style.display = 'none';
        };

        // Matrix Effect
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const letters = "0101010101010101FBI_ACCESS_GRANTED_";
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00ff41";
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
