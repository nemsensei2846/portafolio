<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libros | PROGRAMMING_BOOKS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#00ff41">
    <link rel="apple-touch-icon" href="../logo_sensei.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script>
        // --- Registro de Service Worker para Actualizaciones Agresivas ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../service-worker.js').then(reg => {
                    reg.update(); // Revisar actualización al cargar

                    reg.onupdatefound = () => {
                        const installingWorker = reg.installing;
                        installingWorker.onstatechange = () => {
                            if (installingWorker.state === 'installed') {
                                if (navigator.serviceWorker.controller) {
                                    console.log('>>> ACTUALIZANDO LIBROS...');
                                    window.location.reload();
                                }
                            }
                        };
                    };
                }).catch(err => console.log('Error SW:', err));
            });
            
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    window.location.reload();
                    refreshing = true;
                }
            });
        }

        // --- Protección de Código Fuente ---
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) || (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) {
                return false;
            }
        };
    </script>
</head>
<body class="sensei-theme">
    <canvas id="matrix-canvas"></canvas>
    <div class="scanlines"></div>

    <div class="books-container">
        <a href="../index.html" class="back-btn" title="Volver al Inicio" style="position: absolute; top: 20px; left: 20px; color: var(--sensei-green); font-size: 1.5rem; text-decoration: none; z-index: 10;">
            <i class="fas fa-arrow-left"></i>
        </a>
        <header class="sensei-header">
            <div class="sensei-shield">
                <img src="../logo_sensei.jpg" alt="Sensei Logo">
            </div>
            <h1>BOOK PROGRAMMING DATABASE</h1>
            <p class="status-text">>>> ACCESO CONCEDIDO: NIVEL 1✅</p>
        </header>

        <div class="books-grid" id="books-carousel">
            <!-- Libro 1: Programación Orientada a Objetos -->
            <div class="book-card">
                <img src="fotos/Programacion Orientada a objectos.png" alt="Programación Orientada a Objetos" class="book-cover" onclick="openModal('poo')">
                <div class="book-info">
                    <h3>Programación Orientada a Objetos</h3>
                    <button onclick="viewPDF('poo')" class="sensei-btn">VISUALIZAR</button>
                </div>
            </div>

            <!-- Libro 2: Asincronismo en JavaScript -->
            <div class="book-card">
                <img src="fotos/asincronismo-en-javascript-683x1024.webp" alt="Asincronismo en JavaScript" class="book-cover" onclick="openModal('async')">
                <div class="book-info">
                    <h3>Asincronismo en JavaScript</h3>
                    <button onclick="viewPDF('async')" class="sensei-btn">VISUALIZAR</button>
                </div>
            </div>

            <!-- Libro 3: CSS3 y Javascript Avanzado -->
            <div class="book-card">
                <img src="fotos/CSS3 y Javascript avanzado.png" alt="CSS3 y Javascript Avanzado" class="book-cover" onclick="openModal('cssjs')">
                <div class="book-info">
                    <h3>CSS3 y Javascript Avanzado</h3>
                    <button onclick="viewPDF('cssjs')" class="sensei-btn">VISUALIZAR</button>
                </div>
            </div>

            <!-- Libro 4: Doma de serpientes para niños -->
            <div class="book-card">
                <img src="fotos/Snake Wrangling for Kids, Learning to Program with Python.png" alt="Doma de serpientes para niños" class="book-cover" onclick="openModal('snake')">
                <div class="book-info">
                    <h3>Doma de serpientes para niños</h3>
                    <button onclick="viewPDF('snake')" class="sensei-btn">VISUALIZAR</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Detalles del Libro -->
    <div id="book-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()" style="position: absolute; top: 10px; right: 20px; font-size: 2rem; color: var(--sensei-green); cursor: pointer;">&times;</span>
            <h2 id="modal-title" style="border-bottom: 1px solid var(--sensei-green); padding-bottom: 15px; margin-bottom: 20px;"></h2>
            <div id="modal-body" style="line-height: 1.6;"></div>
        </div>
    </div>

    <!-- Visor de PDF Integrado -->
    <div id="pdf-modal" class="modal-overlay" style="display: none;">
        <div class="pdf-modal-content">
            <div class="pdf-header">
                <h2 id="pdf-title">SENSEI_PDF_VIEWER</h2>
                <span class="close-btn" onclick="closePDF()" style="font-size: 2rem; color: var(--sensei-green); cursor: pointer;">&times;</span>
            </div>
            <iframe id="pdf-viewer" src=""></iframe>
        </div>
    </div>

    <!-- Firebase RTDB Logic -->
    <script type="module">
        // Datos de los libros
        const bookData = {
            poo: {
                title: "Programación Orientada a Objetos",
                path: "Libros/Programacion Orientada a objectos.pdf",
                body: `
                    <p><strong>Título:</strong> Programación Orientada a Objetos</p>
                    <p><strong>Autores:</strong> Roberto Rodríguez Echeverría, Álvaro Prieto Ramos, Encarna Sosa Sánchez</p>
                    <p><strong>Categoría principal:</strong> Programación</p>
                    <p><strong>Idioma:</strong> Español</p>
                    <p><strong>Licencia:</strong> CC BY-NC-SA 3.0</p>
                `
            },
            async: {
                title: "Asincronismo en JavaScript",
                path: "Libros/Asincronismo-en-JavaScript-Charly-Cimino.pdf",
                body: `
                    <p><strong>Título:</strong> Asincronismo en JavaScript</p>
                    <p><strong>Autor:</strong> Charly Cimino</p>
                    <p><strong>Categoría principal:</strong> Programación Web</p>
                    <p><strong>Idioma:</strong> Español</p>
                `
            },
            cssjs: {
                title: "CSS3 y Javascript Avanzado",
                path: "Libros/CSS3-y-Javascript-Avanzado-1.pdf",
                body: `
                    <p><strong>Título:</strong> CSS3 y Javascript Avanzado</p>
                    <p><strong>Autor:</strong> Jordi Collell Puig</p>
                    <p><strong>Categoría principal:</strong> Desarrollo web</p>
                    <p><strong>Subcategoría:</strong> Frontend</p>
                    <p><strong>Idioma:</strong> Español</p>
                `
            },
            snake: {
                title: "Doma de serpientes para niños",
                path: "Libros/doma-de-serpientes-para-ninos_swfk-es-win-0.0.4.pdf",
                body: `
                    <p><strong>Título:</strong> Doma de serpientes para niños</p>
                    <p><strong>Autor:</strong> Jason R. Briggs</p>
                    <p><strong>Categoría principal:</strong> Programación para niños</p>
                    <p><strong>Subcategoría:</strong> Python</p>
                    <p><strong>Idioma:</strong> Español</p>
                `
            }
        };

        window.openModal = (bookId) => {
            const modal = document.getElementById('book-modal');
            const titleEl = document.getElementById('modal-title');
            const bodyEl = document.getElementById('modal-body');
            
            const data = bookData[bookId];
            if (data) {
                titleEl.innerText = "Detalles del Libro";
                bodyEl.innerHTML = data.body;
                modal.style.display = 'flex';
            }
        };

        window.closeModal = () => {
            const modal = document.getElementById('book-modal');
            modal.style.display = 'none';
        };

        // --- Lógica del Visor de PDF ---
        window.viewPDF = (bookId) => {
            const modal = document.getElementById('pdf-modal');
            const viewer = document.getElementById('pdf-viewer');
            const title = document.getElementById('pdf-title');
            const data = bookData[bookId];

            if (data) {
                title.innerText = `VISUALIZANDO: ${data.title.toUpperCase()}`;
                // Usamos Google Docs Viewer para asegurar visualización en móviles sin descargar
                const pdfUrl = window.location.origin + window.location.pathname.replace('libros.html', '') + data.path;
                viewer.src = data.path; // Intento directo primero
                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden'; // Bloquear scroll de fondo
            }
        };

        window.closePDF = () => {
            const modal = document.getElementById('pdf-modal');
            const viewer = document.getElementById('pdf-viewer');
            viewer.src = "";
            modal.style.display = 'none';
            document.body.style.overflow = 'auto'; // Restaurar scroll
        };

        // Matrix Effect
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const letters = "0101010101010101SENSEI_SECURE_NODE_";
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00ff41";
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
